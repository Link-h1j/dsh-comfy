# dsh-comfy bundle patch: inserts the plugin row into the web profile roster.
# The host half (exports ".") registers the /api/dsh-comfy route family; the
# `dsh.client` declaration in package.json loads the browser half (exports
# "./client") as a right-sidebar tab type.
- insert:
    - id: dsh-comfy
      name: dsh-comfy
